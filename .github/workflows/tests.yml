# Runs the D1 and D2 monitor tests on GitHub's computers every time something is pushed or proposed.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned: Python 3.9 is not available on newer Ubuntu images.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        monitor: [D1-monitor, D2-monitor]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests
        working-directory: ${{ matrix.monitor }}
        run: python -m unittest discover -s tests -v
